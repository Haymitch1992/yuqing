services:
  opinion-daily:
    build: .
    image: jiaokong-opinion-daily:latest
    container_name: jiaokong-opinion-daily
    restart: unless-stopped
    ports:
      - "38471:38471"
    environment:
      TZ: Asia/Shanghai
      PORT: "38471"
      HOSTNAME: "0.0.0.0"
      # 发信正文若需带站点链接，改成服务器公网或内网地址
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:38471}
    volumes:
      # 报告、SMTP 设置、定时戳持久化；宿主机目录需对 uid 1001 可写
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:38471/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
